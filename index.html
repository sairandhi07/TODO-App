<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate To-Do App</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Link to external Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="title">
                    <i class="bi bi-check2-square"></i> Ultimate Tasks
                </h2>
                <p class="subtitle">
                    Manage your productivity professionally 🚀
                </p>
            </div>
            <button class="theme-btn" id="themeBtn">
                <i class="bi bi-moon-stars-fill"></i>
            </button>
        </div>

        <!-- Input Section -->
        <div class="input-group mb-3">
            <input type="text" id="todoInput" class="form-control" placeholder="Enter your task...">
            <input type="date" id="taskDate" class="form-control">
            <button class="btn add-btn" id="addBtn">
                <i class="bi bi-plus-lg"></i>
            </button>
        </div>

        <!-- Search Section -->
        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Search tasks...">

        <!-- Progress Section -->
        <div class="progress">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>
        <p class="subtitle mt-2">
            Completed: <span id="progressText">0%</span>
        </p>

        <!-- Filter Buttons -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
        </div>

        <!-- Todo List Container -->
        <div id="todoList"></div>

        <!-- Empty Message -->
        <p class="empty" id="emptyMsg">No tasks available 🚀</p>
    </div>

    <!-- Link to external Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
